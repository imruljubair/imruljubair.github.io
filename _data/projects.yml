# Project cards shown under the Venn diagram in the Areas section.
# ---------------------------------------------------------------------------
# Add, remove, or reorder entries — they render in this order, 3 per row.
#
# Fields:
#   name         Card title. Required.
#   work         Links the card to entries in _data/works.csv — hovering the
#                card highlights those names in the Venn diagram above.
#                Use the work's `name` exactly as spelled in works.csv.
#                Separate several with commas: "PerSign, DIY Graphics Tab".
#                A name with no match in works.csv simply won't highlight.
#   image        Path to a still or animated GIF, relative to the site root.
#                Omit it and the card falls back to a neutral placeholder.
#   description  One or two sentences. ">-" folds the indented lines below it
#                into a single paragraph. Accepts **bold** / [links](url).
#                Keep under ~93 characters so it fits three lines on a card
#                and every card in a row stays the same height.
#   links        All four are optional — omit or leave blank to hide the icon.
#                  code    → GitHub / repository
#                  paper   → paper, PDF, or publication page
#                  video   → YouTube or any video demo
#                  site    → project website or live demo
# ---------------------------------------------------------------------------

