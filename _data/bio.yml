    I’m a Computer Science PhD student at the
    [University of Colorado Boulder](https://www.colorado.edu/cs/), advised by [Prof. Tom Yeh](https://www.byhand.ai/).
    My work combines <span class="bio-area bio-area--ai">AI</span>,
    <span class="bio-area bio-area--viz">visualization</span>, and
